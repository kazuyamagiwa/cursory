name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  install-kit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit

      - name: Create mock user repo with .cursory/
        run: |
          mkdir -p user-repo
          printf '%s\n' \
            '[project]' \
            'name = "user-app"' \
            'version = "0.0.1"' \
            'requires-python = ">=3.12"' \
            'dependencies = []' \
            '' \
            '[build-system]' \
            'requires = ["hatchling"]' \
            'build-backend = "hatchling.build"' \
            > user-repo/pyproject.toml
          mv kit user-repo/.cursory

      - name: Plan mode
        working-directory: user-repo
        run: ./.cursory/install.sh --plan

      - name: Dry-run apply
        working-directory: user-repo
        run: ./.cursory/install.sh --apply --all --dry-run

      - name: Apply all
        working-directory: user-repo
        run: ./.cursory/install.sh --apply --all

      - name: Assert essentials copied, not overwritten pyproject
        working-directory: user-repo
        run: |
          test -f cursory.sh
          test -f AGENTS.md
          test -x scripts/run-python.sh
          test -f .python-version
          test -f .cursor/rules/python-testing.mdc
          grep -q 'name = "user-app"' pyproject.toml
          test ! -f .cursory/_AGENTS.md
          test ! -f .cursory/_run-python.sh
          # launcher points at .cursory
          grep -q '.cursory/install.sh' cursory.sh

      - name: Second apply does not overwrite
        working-directory: user-repo
        run: |
          echo 'USER AGENTS' > AGENTS.md
          printf '%s\n' '# template' > .cursory/_AGENTS.md
          ./.cursory/install.sh --apply --with agents
          grep -q 'USER AGENTS' AGENTS.md
